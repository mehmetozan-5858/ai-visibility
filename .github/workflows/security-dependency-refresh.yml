name: Security dependency refresh

on:
  push:
    branches:
      - paddle-sandbox-integration
    paths:
      - .github/workflows/security-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paddle-sandbox-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin audited versions and regenerate lockfile
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.ai = '5.0.222';
          p.dependencies.next = '16.4.1';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run build
      - name: Commit audited dependency refresh
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: refresh audited runtime dependencies'
          git push origin HEAD:paddle-sandbox-integration
