name: Lockfile Diagnostic
on:
  pull_request:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-dependencies-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm audit --audit-level=low
      - name: Commit regenerated lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate lockfile for patched dependencies"
          git push origin HEAD:fix/security-dependencies-20261016
