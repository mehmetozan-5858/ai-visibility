name: Lockfile Diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        with:
          name: patched-lockfile
          path: package-lock.json
          retention-days: 1
