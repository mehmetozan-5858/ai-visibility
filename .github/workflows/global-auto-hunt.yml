name: Global Auto Hunt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger global lead hunt
        env:
          AUTO_HUNT_URL: ${{ secrets.AUTO_HUNT_URL }}
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_URL" || { echo "AUTO_HUNT_URL secret missing"; exit 1; }
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET secret missing"; exit 1; }
          curl --fail --silent --show-error \
            -X POST "$AUTO_HUNT_URL" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"mode":"global","priorityMarkets":["Türkiye","United Kingdom","Germany","France","Netherlands","Italy","Spain","United States","Canada","United Arab Emirates"],"turkeyPriorityCities":["İstanbul","Ankara","İzmir","Antalya","Bursa"],"limitPerRun":20}'
