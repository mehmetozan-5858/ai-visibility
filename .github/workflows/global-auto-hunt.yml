name: Global Auto Hunt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  business-agent-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run integrated global business agent cycle
        env:
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET missing"; exit 1; }
          curl --fail --silent --show-error \
            -X GET "https://www.aivisibilityworks.com/api/cron/daily-cycle" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET"

  creator-agent-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run global creator hunt
        env:
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET missing"; exit 1; }
          curl --fail --silent --show-error \
            -X GET "https://www.aivisibilityworks.com/api/creator-hunt" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET"

  follow-up-agent-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run controlled follow-up agent
        env:
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET missing"; exit 1; }
          curl --fail --silent --show-error \
            -X GET "https://www.aivisibilityworks.com/api/follow-up-cycle" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET"

  implementation-agent-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run paid customer implementation orchestrator
        env:
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET missing"; exit 1; }
          curl --fail --silent --show-error \
            -X GET "https://www.aivisibilityworks.com/api/implementation-cycle" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET"

  remeasurement-agent-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run post implementation remeasurement
        env:
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET missing"; exit 1; }
          curl --fail --silent --show-error \
            -X GET "https://www.aivisibilityworks.com/api/remeasurement-cycle" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET"

  predictive-guard-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run predictive anomaly guard
        env:
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET missing"; exit 1; }
          curl --fail --silent --show-error \
            -X GET "https://www.aivisibilityworks.com/api/predictive-guard" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET"
