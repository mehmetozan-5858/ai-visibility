      - name: Run integrated global business agent cycle
        env:
          AUTO_HUNT_SECRET: ${{ secrets.AUTO_HUNT_SECRET }}
        run: |
          test -n "$AUTO_HUNT_SECRET" || { echo "AUTO_HUNT_SECRET missing"; exit 1; }
          curl --fail --silent --show-error \
            -X GET "https://www.aivisibilityworks.com/api/cron/daily-cycle" \
            -H "Authorization: Bearer $AUTO_HUNT_SECRET"

