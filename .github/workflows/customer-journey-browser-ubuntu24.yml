name: Customer Journey Browser Acceptance (Ubuntu 24.04)
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/smoke-customer-journey-browser.mjs'
      - '.github/workflows/customer-journey-browser-ubuntu24.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-journey-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  applicant-browser:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUTH_SECRET: ci-only-synthetic-auth-secret-for-browser-smoke-test
      ADMIN_PASSWORD: ci-only-synthetic-admin-password
      LEAD_EMAIL_VERIFICATION_ENABLED: 'false'
      APPLICANT_ASSESSMENT_PREVIEW_ENABLED: 'false'
      NEXT_PUBLIC_LEAD_EMAIL_VERIFICATION_ENABLED: 'false'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.1
      - run: npx playwright install chromium
      # Browser execution remains mandatory; this only avoids Ubuntu apt downloads during setup.
      - run: npm run build
      - name: Start local isolated web server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ai-visibility-browser-smoke.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/yeni-musteri -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ai-visibility-browser-smoke.log
          exit 1
      - name: Browser smoke of applicant pages (mobile + desktop)
        run: node scripts/smoke-customer-journey-browser.mjs
