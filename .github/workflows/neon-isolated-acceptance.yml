name: Neon Isolated Acceptance
on:
  pull_request:
    paths:
      - 'scripts/verify-neon-command-control.mjs'
      - '.github/workflows/neon-isolated-acceptance.yml'
permissions:
  contents: read
jobs:
  neon-transport:
    # Explicit opt-in plus same-repository integration branch; no fork secrets.
    if: >-
      vars.RUN_NEON_ISOLATED_ACCEPTANCE == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/portfolio-verified-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify isolated Neon connection and scoped commands
        env:
          AGENT_TEST_DATABASE_URL: ${{ secrets.NEON_ACCEPTANCE_WRITER_URL }}
          AGENT_TEST_READER_PASSWORD: ${{ secrets.NEON_ACCEPTANCE_READER_PASSWORD }}
          AGENT_TEST_EXPECTED_HOST: ep-red-queen-b2d4u7z4-pooler.c-6.eu-central-1.aws.neon.tech
          AGENT_TEST_ENVIRONMENT: neon-isolated-branch
        run: node scripts/verify-neon-command-control.mjs
