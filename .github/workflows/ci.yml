name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - name: Inspect candidate dependency versions
        run: |
          npm view ai@6 version --json
          npm view next@16.4.2 version
      - name: Test patched dependency set
        run: npm install --no-save next@16.4.2 ai@6
      - name: Security audit diagnostic
        run: npm audit --json || true
      - run: npm test
      - run: npm run build
