name: Web & Mobile Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-production-smoke.spec.js'
      - 'tests/mobile-onboarding-location.spec.js'
      - 'tests/web-production-smoke.spec.js'
      - 'tests/ai-visibility-launch-service-matrix.test.mjs'
      - '.github/workflows/mobile-production-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-production-smoke.spec.js'
      - 'tests/mobile-onboarding-location.spec.js'
      - 'tests/web-production-smoke.spec.js'
      - 'tests/ai-visibility-launch-service-matrix.test.mjs'
      - '.github/workflows/mobile-production-smoke.yml'

permissions:
  contents: read

jobs:
  web-mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_PASSWORD: ci-only-local-password-fixture
      AUTH_SECRET: ci-only-local-signing-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact commit
        run: npm run build
      - name: Start exact commit
        run: |
          npm start > /tmp/aiv-smoke.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aiv-smoke.log
          exit 1
      - name: Test public web and customer app surfaces
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/web-production-smoke.spec.js tests/mobile-production-smoke.spec.js tests/mobile-onboarding-location.spec.js --reporter=line
