name: Web & Mobile Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-production-smoke.spec.js'
      - 'tests/admin-pilot-browser.spec.js'
      - 'tests/preview-login-browser.spec.js'
      - 'tests/mobile-onboarding-location.spec.js'
      - 'tests/web-production-smoke.spec.js'
      - '.github/workflows/mobile-production-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-production-smoke.spec.js'
      - 'tests/admin-pilot-browser.spec.js'
      - 'tests/mobile-onboarding-location.spec.js'
      - 'tests/web-production-smoke.spec.js'
      - '.github/workflows/mobile-production-smoke.yml'

permissions:
  contents: read

jobs:
  web-mobile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ADMIN_PASSWORD: ci-only-local-password-fixture
      AUTH_SECRET: ci-only-local-signing-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.1
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        # Avoid apt network calls during browser setup; the runner must still satisfy Chromium runtime dependencies.
      - name: Build exact commit
        run: npm run build
      - name: Start exact commit
        run: |
          npm start > /tmp/aiv-smoke.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aiv-smoke.log
          exit 1
      - name: Verify request-proxy protection on Vercel preview host
        run: |
          curl -fsS -H 'Host: ai-visibility-ci-guard.vercel.app' http://127.0.0.1:3000/login | grep -F 'Önizleme: yönetici girişi kapalı'
          test "$(curl -sS -o /tmp/aiv-preview-login-response -w '%{http_code}' -H 'Host: ai-visibility-ci-guard.vercel.app' -H 'Content-Type: application/json' -X POST --data '{"password":"synthetic-fixture"}' http://127.0.0.1:3000/api/auth/login)" = 503
          grep -F 'Vercel önizlemesinde yönetici girişi kapalıdır.' /tmp/aiv-preview-login-response
      - name: Start isolated preview mode without any database URL
        run: |
          env -u DATABASE_URL -u DATABASE_URL_UNPOOLED -u POSTGRES_URL -u STORAGE_URL -u ZERA_PREVIEW_DATABASE_URL VERCEL_ENV=preview PORT=3001 npm start > /tmp/aiv-preview-smoke.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aiv-preview-smoke.log
          exit 1
      - name: Verify preview safety screen with browser and no real database
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3001
        run: npx playwright test tests/preview-login-browser.spec.js --reporter=line
      - name: Test public web and customer app surfaces
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/web-production-smoke.spec.js tests/mobile-production-smoke.spec.js tests/mobile-onboarding-location.spec.js tests/admin-pilot-browser.spec.js --reporter=line
