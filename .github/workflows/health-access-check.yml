name: Management API access check
on:
  push:
    branches: [main]
    paths:
      - app/api/system-health-map/route.js
      - app/api/decision-audit/route.js
      - app/api/agent-activity/route.js
      - app/api/answer-evidence/daily/route.js
      - .github/workflows/health-access-check.yml
permissions:
  contents: read
jobs:
  anonymous-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production rejects anonymous management API reads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            passed=true
            for endpoint in system-health-map decision-audit agent-activity answer-evidence/daily; do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "https://www.aivisibilityworks.com/api/$endpoint" || true)
              echo "Attempt $attempt: $endpoint HTTP $status"
              if [ "$status" != "401" ]; then passed=false; fi
            done
            if [ "$passed" = true ]; then exit 0; fi
            sleep 15
          done
          echo 'Production did not reject all anonymous requests with HTTP 401.'
          exit 1
